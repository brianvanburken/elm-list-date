name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ELM_HOME: ".elm"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: elm_cache
        with:
          path: .elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}
      - name: Install Elm dependencies
        if: steps.elm_cache.outputs.cache-hit != 'true'
        run: |
          printf 'module A exposing (a)\na = 0\n' > Temp.elm
          elm make Temp.elm --output=/dev/null
          rm Temp.elm
      - parallel:
          - run: elm make src/ListDate.elm --output /dev/null
          - run: elm-test-rs
          - run: elm-format --validate src/ tests/
