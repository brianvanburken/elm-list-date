name: CI

on:
  push:
  pull_request:

env:
  ELM_HOME: ".elm"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: elm_cache
        with:
          path: .elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}
      - name: Install Elm dependencies
        if: steps.elm_cache.outputs.cache-hit != 'true'
        run: |
          printf 'module A exposing (a)\na = 0\n' > Temp.elm
          nix develop --command elm make Temp.elm --output=/dev/null
          rm Temp.elm
      - parallel:
        - run: nix develop --command elm make src/ListDate.elm --output /dev/null
        - run: nix develop --command elm-test-rs
        - run: nix develop --command elm-format --validate src/ tests/
